# Configuration Railway pour Next.js (Railpack)
# Source de vérité à terme : `.railway/railway.ts` (IaC). Ce fichier reste lu par Railway
# jusqu’à `railway config migrate cutover` — voir GUIDE-DEPLOIEMENT-RAILWAY.md.

[build]
builder = "RAILPACK"
# NODE_OPTIONS déjà dans le script `build` de package.json (4096 Mo — next build + TypeScript)
# Mémoire explicite côté Railpack (le script npm le définit aussi — redondance volontaire).
# Turbopack uniquement : webpack (`next build --webpack`) provoque OOM en SSG sur Railpack.
# `build:railway` = alias de `build` (filet si le dashboard Railway appelle encore ce script).
buildCommand = "NODE_OPTIONS=--max-old-space-size=4096 npm run build"

[deploy]
startCommand = "npm run start"
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
