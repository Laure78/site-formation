# Configuration Railway pour Next.js (Railpack)

[build]
builder = "RAILPACK"
# NODE_OPTIONS déjà dans le script `build` de package.json (4096 Mo — next build + TypeScript)
# Mémoire explicite côté Railpack (le script npm le définit aussi — redondance volontaire).
buildCommand = "NODE_OPTIONS=--max-old-space-size=4096 npm run build"

[deploy]
startCommand = "npm run start"
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
